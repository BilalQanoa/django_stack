<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amadon Checkout</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .receipt-card { max-width: 500px; margin: 0 auto; border: none; border-radius: 12px; }
        .receipt-header { background-color: #0d6efd; color: #fff; border-radius: 12px 12px 0 0 !important; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="card shadow receipt-card">
            <div class="card-header receipt-header text-center py-4 border-0">
                <h3 class="mb-0 fw-bold">Thank You for Your Business!</h3>
            </div>
            <div class="card-body p-5 text-center">
                {% if last_order %}
                <p class="fs-5 mb-4">
                    We charged your credit card for <strong>${{ last_order.total_price }}</strong>
                </p>
                {% else %}
                <p class="fs-5 mb-4 text-warning">
                    No recent order found.
                </p>
                {% endif %}
                
                <hr class="my-4">
                
                <p class="text-muted mb-1 fs-6">You have ordered a total of</p>
                <h4 class="mb-4 fw-bold">{{ total_quantity }} items</h4>
                
                <p class="text-muted mb-1 fs-6">and spent a total of</p>
                <h4 class="mb-4 fw-bold">${{ total_spent }}</h4>
                
                <div class="mt-5">
                    <a href="/amadon/" class="btn btn-outline-primary px-4 py-2">Go Back to Store</a>
                </div>
            </div>
        </div>
    </div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
