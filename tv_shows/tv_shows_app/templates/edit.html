{% extends 'base.html' %}

{% block title %}Edit Show {{ show.id }}{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="form-card edit-card border-0">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-edit text-warning me-2"></i>Edit Show {{ show.id }}</h2>
            <p class="text-muted">Update the details for {{ show.title }}</p>
        </div>

        <!-- Edit Show Info -->
        <form action="/shows/{{ show.id }}/update" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" value="{{ show.title }}" required>
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="network" class="form-label">Network</label>
                    <input type="text" class="form-control" id="network" name="network" value="{{ show.network }}" required>
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="release_date" class="form-label">Release Date</label>
                    <input type="date" class="form-control" id="release_date" name="release_date" value="{{ show.release_date|date:'Y-m-d' }}" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4">{{ show.description }}</textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <div>
                    <!-- View action -->
                    <a href="/shows/{{ show.id }}" class="back-link me-3"><i class="fas fa-eye me-1"></i> View</a>
                    <!-- Back action -->
                    <a href="/shows" class="back-link"><i class="fas fa-arrow-left me-1"></i> Back</a>
                </div>
                <!-- Update button -->
                <button type="submit" class="btn btn-warning btn-custom shadow-sm text-dark">Update Show</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
