{% extends 'tv_shows_app/base.html' %}

{% block title %}Add a New Show{% endblock %}

{% block content %}
<div class="form-wrapper">
    <div class="form-card new-card border-0">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-dark"><i class="fas fa-plus-circle text-primary me-2"></i>Add a New Show</h2>
            <p class="text-muted">Enter the details of the TV show below</p>
        </div>

        <form action="/shows/create" method="POST">
            {% csrf_token %}
            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input type="text" class="form-control" id="title" name="title" required placeholder="e.g. Breaking Bad">
            </div>
            
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="network" class="form-label">Network</label>
                    <input type="text" class="form-control" id="network" name="network" required placeholder="e.g. AMC">
                </div>
                <div class="col-md-6 mt-3 mt-md-0">
                    <label for="release_date" class="form-label">Release Date</label>
                    <input type="date" class="form-control" id="release_date" name="release_date" required>
                </div>
            </div>

            <div class="mb-4">
                <label for="description" class="form-label">Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" placeholder="Enter a brief description..."></textarea>
            </div>

            <div class="d-flex justify-content-between align-items-center">
                <a href="/shows" class="back-link"><i class="fas fa-arrow-left me-1"></i> Back to Shows</a>
                <button type="submit" class="btn btn-primary btn-custom shadow-sm">Create Show</button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
